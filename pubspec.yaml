name: swaeq_senior
description: SwaEQ Senior Care Android app — daily routine, content, reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  provider: ^6.1.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^4.1.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/bg/
